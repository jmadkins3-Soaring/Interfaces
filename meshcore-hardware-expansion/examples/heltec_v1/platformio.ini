; ---------------------------------------------------------------------------
; MeshCore variant: Heltec WiFi LoRa 32 (V1)
; ---------------------------------------------------------------------------
; Worked Tier-1 example for the meshcore-hardware-expansion plan.
;
; MCU   : ESP32 (classic, dual-core, BLE + WiFi)
; Radio : Semtech SX1276 (RFM95-class)  -> CustomSX1276 wrapper (already in MeshCore)
; Pins  : translated from Meshtastic variants/esp32/heltec_v1/variant.h plus the
;         standard Heltec WiFi LoRa 32 V1 VSPI LoRa wiring.
;
; To use: copy this directory into the MeshCore tree as variants/heltec_v1/
; then `pio run -e Heltec_v1_companion_radio_ble` (or any env below).
; ---------------------------------------------------------------------------

[Heltec_lora32_v1]
extends = esp32_base
board = heltec_wifi_lora_32
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_v1
  -D HELTEC_LORA_V1
  -D ESP32_CPU_FREQ=80
  ; ---- LoRa (SX1276 on VSPI) ----
  -D P_LORA_NSS=18
  -D P_LORA_RESET=14
  -D P_LORA_DIO_0=26
  -D P_LORA_DIO_1=RADIOLIB_NC
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=27
  -D USE_SX1276
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D LORA_TX_POWER=20
  ; ---- on-board peripherals ----
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=15
  -D PIN_USER_BTN=0
  -D PIN_STATUS_LED=25
  -D PIN_VBAT_READ=13
  -D ADC_MULTIPLIER=3.2
  -D PIN_GPS_RX=36
  -D PIN_GPS_TX=33
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v1>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

; ---- Repeater -------------------------------------------------------------
[env:Heltec_v1_repeater]
extends = Heltec_lora32_v1
build_flags =
  ${Heltec_lora32_v1.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec V1 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Heltec_lora32_v1.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v1.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

; ---- Room server ----------------------------------------------------------
[env:Heltec_v1_room_server]
extends = Heltec_lora32_v1
build_flags =
  ${Heltec_lora32_v1.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec V1 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${Heltec_lora32_v1.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${Heltec_lora32_v1.lib_deps}
  ${esp32_ota.lib_deps}

; ---- Companion radio (BLE) ------------------------------------------------
[env:Heltec_v1_companion_radio_ble]
extends = Heltec_lora32_v1
build_flags =
  ${Heltec_lora32_v1.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Heltec_lora32_v1.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_lora32_v1.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ---- Companion radio (USB serial) -----------------------------------------
[env:Heltec_v1_companion_radio_usb]
extends = Heltec_lora32_v1
build_flags =
  ${Heltec_lora32_v1.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${Heltec_lora32_v1.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_lora32_v1.lib_deps}
  densaugeo/base64 @ ~1.4.0
