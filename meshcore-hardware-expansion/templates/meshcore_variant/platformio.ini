; ===========================================================================
; MeshCore variant TEMPLATE  —  copy to variants/<BOARD>/ and fill the TODOs
; ===========================================================================
; Replace:
;   <BOARD>      lowercase id, e.g. canaryone
;   <BoardName>  CamelCase, e.g. CanaryOne  (matches <BoardName>Board class)
;   <BASE>       esp32_base | esp32s3_base | nrf52840_base | rp2040_base | stm32_base
;   <RADIO>      SX1262 | SX1268 | SX1276 | LLCC68 | LR1110 | STM32WLx
; Pick the matching pin block below for your radio and delete the other.
; ===========================================================================

[<BoardName>_base]
extends = <BASE>
board = TODO_platformio_board_id        ; a registry board, or boards/<BOARD>.json
build_flags =
  ${<BASE>.build_flags}
  ${sensor_base.build_flags}
  -I variants/<BOARD>
  -D <BOARD_MACRO>                       ; e.g. -D CANARYONE

  ; ---- SX126x / LLCC68 / LR11x0 (use BUSY line) ----
  -D P_LORA_NSS=TODO
  -D P_LORA_RESET=TODO
  -D P_LORA_DIO_1=TODO
  -D P_LORA_BUSY=TODO
  -D P_LORA_SCLK=TODO
  -D P_LORA_MISO=TODO
  -D P_LORA_MOSI=TODO
  -D USE_<RADIO>
  -D RADIO_CLASS=Custom<RADIO>
  -D WRAPPER_CLASS=Custom<RADIO>Wrapper
  -D LORA_TX_POWER=22
  ; SX126x extras (delete if not SX126x):
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140

  ; ---- OR SX127x / RFM95 (use DIO0, no BUSY) — delete the block above ----
  ; -D P_LORA_NSS=TODO
  ; -D P_LORA_RESET=TODO
  ; -D P_LORA_DIO_0=TODO
  ; -D P_LORA_DIO_1=TODO
  ; -D P_LORA_SCLK=TODO
  ; -D P_LORA_MISO=TODO
  ; -D P_LORA_MOSI=TODO
  ; -D USE_SX1276
  ; -D RADIO_CLASS=CustomSX1276
  ; -D WRAPPER_CLASS=CustomSX1276Wrapper

  ; ---- board peripherals ----
  -D PIN_BOARD_SDA=TODO
  -D PIN_BOARD_SCL=TODO
  -D PIN_USER_BTN=TODO
  -D PIN_VBAT_READ=TODO
  -D ADC_MULTIPLIER=TODO
build_src_filter = ${<BASE>.build_src_filter}
  +<../variants/<BOARD>>
  +<helpers/sensors>
lib_deps =
  ${<BASE>.lib_deps}
  ${sensor_base.lib_deps}

; --- One [env:] per firmware role. Add only the roles the device suits. ---
; Headless devices: repeater / room_server / sensor.
; Devices with display + BLE/USB/WiFi: also companion_radio_*.

[env:<BoardName>_repeater]
extends = <BoardName>_base
build_flags =
  ${<BoardName>_base.build_flags}
  -D ADVERT_NAME='"<BoardName> Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${<BoardName>_base.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${<BoardName>_base.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:<BoardName>_companion_radio_ble]
extends = <BoardName>_base
build_flags =
  ${<BoardName>_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  ; -D DISPLAY_CLASS=SSD1306Display   ; uncomment if the board has an OLED
build_src_filter = ${<BoardName>_base.build_src_filter}
  +<helpers/esp32/*.cpp>              ; nRF52: use +<helpers/nrf52/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${<BoardName>_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
